spring.application.name=skillshowcase
server.port=${PORT:8080}

# ---- MySQL (Railway variables override these online) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillshowcase_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:YOUR_MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- JWT (secret must be 32+ characters) ----
app.jwt.secret=${JWT_SECRET:change-this-secret-to-any-long-random-text-123456}
app.jwt.expiration-ms=86400000

# ---- Allowed websites (comma separated) ----
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}
