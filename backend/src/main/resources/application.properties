spring.application.name=skillshowcase
server.port=8080

# ---- MySQL: change the password to YOUR MySQL password ----
spring.datasource.url=jdbc:mysql://localhost:3306/skillshowcase_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---- JWT (secret must be 32+ characters) ----
app.jwt.secret=change-this-secret-to-any-long-random-text-123456
app.jwt.expiration-ms=86400000

# ---- React dev server address ----
app.cors.allowed-origin=http://localhost:5173
